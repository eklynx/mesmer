# A tag v* builds the plugin on every enabled platform from this tree (Windows and
# macOS and Linux), runs each one's tests, merges the builds into
# one Mesmer-<version>.zip with src/scripts/package_release.sh, and publishes it, its
# SHA256SUMS and a build provenance attestation as a GitHub pre-release, with the
# CHANGELOG entry as its notes. Nothing is published unless every enabled platform
# built and passed. The tag and its commit come from flightsim's publish; nothing here
# edits code. Specification: docs/dev/release-packaging.md.
#
# Each platform can be switched off without editing this file, by a repository
# variable (the same three ci.yml reads):
#   WINDOWS_BUILD, MACOS_BUILD, LINUX_BUILD   on unless the variable is exactly `false`
#
# The macOS plugin can be signed and notarized by a separate signing repository
# (docs/dev/release-signing.md). Off unless the repository variable MACOS_SIGNING_REPO
# (OWNER/NAME of that repository) is set; then the secret MACOS_SIGNING_TOKEN is
# required, the signing run must succeed for this exact commit, and the release ships
# the signed plugin. With it set and signing failing, nothing is published.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The X-Plane SDK, downloaded at build time under its own licence. The
  # publish checks this pin against the one the author's own builds use.
  XPLANE_SDK_URL: https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip
  XPLANE_SDK_SHA256: b9875ab27b593927b4f9b3e0ddfffe7401ee5dce6d86b50aea0da65f70ff7816

jobs:
  # The tag, the version and which platforms this run builds. The outputs are the one
  # list the build jobs and `package` agree on.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      windows: ${{ steps.platforms.outputs.windows }}
      macos: ${{ steps.platforms.outputs.macos }}
      linux: ${{ steps.platforms.outputs.linux }}
      sign_macos: ${{ steps.platforms.outputs.sign_macos }}
      signing_repo: ${{ steps.platforms.outputs.signing_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A fork release may carry its branch in the tag (v0.0.11-macos-buttons); the version is only the number.
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z][0-9A-Za-z._-]*)?$') {throw "Tag $env:TAG is not v<major.minor.patch> or v<major.minor.patch>-<branch>"}
          $version=$Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Platforms to build
        id: platforms
        env:
          WINDOWS_BUILD: ${{ vars.WINDOWS_BUILD }}
          MACOS_BUILD: ${{ vars.MACOS_BUILD }}
          LINUX_BUILD: ${{ vars.LINUX_BUILD }}
          MACOS_SIGNING_REPO: ${{ vars.MACOS_SIGNING_REPO }}
        run: |
          $signing=$env:MACOS_SIGNING_REPO
          if ($signing -and $signing -notmatch '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$') {throw "MACOS_SIGNING_REPO '$signing' is not OWNER/NAME"}
          "sign_macos=$((($env:MACOS_BUILD -ne 'false') -and [bool]$signing).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "signing_repo=$signing" >> $env:GITHUB_OUTPUT
          "windows=$(($env:WINDOWS_BUILD -ne 'false').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "macos=$(($env:MACOS_BUILD -ne 'false').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "linux=$(($env:LINUX_BUILD -ne 'false').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Get-Content $env:GITHUB_OUTPUT

  build-windows:
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify the X-Plane SDK
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'xplane-sdk.zip'
          Invoke-WebRequest -Uri $env:XPLANE_SDK_URL -OutFile $zip
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:XPLANE_SDK_SHA256) {throw "X-Plane SDK checksum $hash does not match the pin"}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'xplane-sdk')
          "XPLANE_SDK=$(Join-Path $env:RUNNER_TEMP 'xplane-sdk\SDK')" >> $env:GITHUB_ENV

      - name: Build
        run: |
          cmake -S src -B build -G "Visual Studio 17 2022" -A x64 "-DXPLANE_SDK=$env:XPLANE_SDK"
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cmake --build build --config Release
          if ($LASTEXITCODE) {exit $LASTEXITCODE}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Only the platform's binary: the shared files come from the repository in `package`.
      - name: Keep the plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-win
          path: build/Release/BrunnerDirect.xpl
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Universal, -Werror, ad hoc signed and verified, ctest: docs/dev/macos-build.md.
      - name: Build and test
        run: src/scripts/build_macos.sh

      - name: Keep the plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-mac
          path: build/stage/BrunnerDirect/mac_x64/BrunnerDirect.xpl
          if-no-files-found: error
          retention-days: 7

  # Has the signing repository sign and notarize this commit's macOS plugin, then checks the
  # result is for this repository and commit (docs/dev/release-signing.md). Runs only after the
  # macOS build and its tests passed, so only a commit that tests green is ever signed.
  sign-macos:
    needs: [plan, build-macos]
    if: ${{ needs.plan.outputs.sign_macos == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Have the signing repository sign this commit
        env:
          GH_TOKEN: ${{ secrets.MACOS_SIGNING_TOKEN }}
          SIGNING_REPO: ${{ needs.plan.outputs.signing_repo }}
        run: |
          src/scripts/fetch_signed_plugin.sh --signing-repo "$SIGNING_REPO" --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --out dist/signed

      - name: Keep the signed plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-mac-signed
          path: dist/signed/
          if-no-files-found: error
          retention-days: 7

  # -Werror, ELF check, ctest: docs/dev/linux-build.md.
  build-linux:
    needs: plan
    if: ${{ needs.plan.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake libgl-dev

      - name: Build and test
        run: src/scripts/build_linux.sh

      - name: Keep the plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-lin
          path: build/stage/BrunnerDirect/lin_x64/BrunnerDirect.xpl
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [plan, build-windows, build-macos, sign-macos, build-linux]
    # Runs when the builds finished one way or another, so a skipped build is judged
    # below (fine when `plan` turned it off, fatal when it was meant to run).
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every enabled platform built and passed
        env:
          WINDOWS: ${{ needs.plan.outputs.windows }} ${{ needs.build-windows.result }}
          MACOS: ${{ needs.plan.outputs.macos }} ${{ needs.build-macos.result }}
          LINUX: ${{ needs.plan.outputs.linux }} ${{ needs.build-linux.result }}
          SIGNING: ${{ needs.plan.outputs.sign_macos }} ${{ needs.sign-macos.result }}
        run: |
          fail=0
          for entry in "Windows:$WINDOWS" "macOS:$MACOS" "macOS signing:$SIGNING" "Linux:$LINUX"; do
            name="${entry%%:*}"; rest="${entry#*:}"; enabled="${rest%% *}"; result="${rest#* }"
            if [ "$enabled" = true ] && [ "$result" != success ]; then
              echo "::error::$name build was enabled but its result is $result; nothing is published"
              fail=1
            fi
          done
          exit $fail

      - name: Download the Windows plugin
        if: ${{ needs.plan.outputs.windows == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-win
          path: dist/in/win

      - name: Download the macOS plugin
        if: ${{ needs.plan.outputs.macos == 'true' && needs.plan.outputs.sign_macos != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-mac
          path: dist/in/mac

      - name: Download the signed macOS plugin
        if: ${{ needs.plan.outputs.sign_macos == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-mac-signed
          path: dist/in/mac

      - name: Download the Linux plugin
        if: ${{ needs.plan.outputs.linux == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-lin
          path: dist/in/lin

      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          WINDOWS: ${{ needs.plan.outputs.windows }}
          MACOS: ${{ needs.plan.outputs.macos }}
          LINUX: ${{ needs.plan.outputs.linux }}
        run: |
          args=(--version "$VERSION" --out dist)
          [ "$WINDOWS" = true ] && args+=(--win dist/in/win)
          [ "$MACOS" = true ] && args+=(--mac dist/in/mac)
          [ "$LINUX" = true ] && args+=(--linux dist/in/lin)
          src/scripts/package_release.sh "${args[@]}"

      # GitHub attests only public repositories on personal plans, so a release
      # staged while the repository is private has none.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Mesmer-${{ needs.plan.outputs.version }}.zip

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $lines=Get-Content -LiteralPath CHANGELOG.md
          $heading='^##\s+\[?v?'+[regex]::Escape($env:VERSION)+'\]?(\s|\]|$)'
          $inside=$false;$notes=@()
          foreach ($line in $lines) {
            if ($line.StartsWith('## ')) {if ($inside) {break};$inside=$line -match $heading;continue}
            if ($inside) {$notes+=$line}
          }
          $text=($notes -join "`n").Trim()
          if (!$text) {throw "CHANGELOG.md has no entry for $env:VERSION"}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'notes.md'),$text+"`n")

      - name: Say who signed the macOS plugin
        if: ${{ needs.plan.outputs.sign_macos == 'true' }}
        run: |
          run_url="$(jq -r .run dist/in/mac/provenance.json)"
          who="$(jq -r .signer.authority dist/in/mac/provenance.json)"
          printf '\nThe macOS plugin is signed by %s and notarized by Apple (signing run: %s).\n' "$who" "$run_url" >> "$RUNNER_TEMP/notes.md"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$TAG" "dist/Mesmer-$VERSION.zip" dist/SHA256SUMS --prerelease --verify-tag --title "Mesmer $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
